name: Build Windows plugins

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE 8
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test MEMORY DSP
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/AE8_artefacts/Release/VST3/AE-8 POLY.vst3" dist/
          Copy-Item "build/AE8_artefacts/Release/Standalone/AE-8 POLY.exe" dist/
          Copy-Item -Recurse "build/AE8TUNE_artefacts/Release/VST3/AE-8 TUNE.vst3" dist/
          Copy-Item "build/AE8TUNE_artefacts/Release/Standalone/AE-8 TUNE.exe" dist/
          Copy-Item -Recurse "build/AE8TAPE_artefacts/Release/VST3/AE-8 TAPE.vst3" dist/
          Copy-Item "build/AE8TAPE_artefacts/Release/Standalone/AE-8 TAPE.exe" dist/
          Copy-Item -Recurse "build/AE8CHOP_artefacts/Release/VST3/AE-8 CHOP.vst3" dist/
          Copy-Item "build/AE8CHOP_artefacts/Release/Standalone/AE-8 CHOP.exe" dist/
          Copy-Item -Recurse "build/AE8MEMORY_artefacts/Release/VST3/AE-8 MEMORY.vst3" dist/
          Copy-Item "build/AE8MEMORY_artefacts/Release/Standalone/AE-8 MEMORY.exe" dist/
          Copy-Item README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: AE-8-Plugins-Windows
          path: dist
